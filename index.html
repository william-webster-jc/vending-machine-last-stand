<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vending Machine Last Stand</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0b14;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* "pixelated" stops the browser blurring our chunky pixels when it
       scales the game up. Without this the whole 8-bit look is ruined. */
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;

      /* The game draws its own crosshair, so the normal arrow cursor is
         hidden while the mouse is over the play area. */
      cursor: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
